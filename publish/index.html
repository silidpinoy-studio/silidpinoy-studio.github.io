        } catch(e){console.error("PPT Error:",e);const m='Could not build the PowerPoint file: '+((e&&e.message)||'unknown error');if(window.SilidToast) window.SilidToast.error(m); else alert(m);}
      };

      const isDelimiterRow = (s) => {
        s = s.trim();
        return /^[\s|:-]+$/.test(s) && /-/.test(s);
      };
      const splitRow = (row) => {
        let r = row.trim();
        if (r.startsWith('|')) r = r.slice(1);
        if (r.endsWith('|')) r = r.slice(0, -1);
        return r.split('|').map(c => c.trim());
      };
      const buildTable = (header, body) => {
        const cs = "border:1pt solid #000;padding:4pt 8pt;";
        let t = '<table style="border-collapse:collapse;width:100%;margin:12pt 0" border="1">';
        t += '<thead><tr>';
        header.forEach(h => { t += `<th style="${cs}background:#EEEEEE;font-weight:bold;text-align:left">${h}</th>`; });
        t += '</tr></thead><tbody>';
        body.forEach(row => {
          t += '<tr>';
          row.forEach(c => { t += `<td style="${cs}text-align:left">${c}</td>`; });
          t += '</tr>';
        });
        t += '</tbody></table>';
        return t;
      };
      const convertTables = (md) => {
        md = md.replace(/\r\n/g, '\n');
        const lines = md.split('\n');
        const out = [];
        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          const next = lines[i + 1] || '';
          if (line.includes('|') && isDelimiterRow(next)) {
            const header = splitRow(line);
            const body = [];
            i += 2;
            while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') {
              body.push(splitRow(lines[i]));
              i++;
            }
            out.push(buildTable(header, body));
            continue;
          }
          out.push(line);
          i++;
        }
        return out.join('\n');
      };

      const escHtml = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const OPT_RE = /^\s*\(?([A-Da-d])[).]\s+(.+)$/;
      const isSequential = (run) => run.every((o,k) => o.letter === String.fromCharCode(65 + k));
      /* Width of the question's number prefix ("1. ", "12) ") so the choices line up with the
         first word of the question above them instead of hugging the page margin.
         Only the Word export and choice runs with no numbered stem need it now: on screen
         and on paper the question grid positions the whole choice block itself. */
      const optionIndent = (lines, i) => {
        let q = '';
        for (let k = i - 1; k >= 0; k--) { if (lines[k].trim()) { q = lines[k]; break; } }
        const m = q.match(/^\s*\(?(\d+|[A-Za-z])[.)]\s/);
        if (!m) return '1.1em';
        return (Math.round((m[1].length * 0.6 + 0.5) * 10) / 10) + 'em';
      };
      const renderOptions = (run, indent, forWord, kid) => {
        const maxLen = Math.max(...run.map(o => o.text.length));
        const mode = maxLen <= 22 ? 'row' : (maxLen > 45 ? 'stack' : 'grid2');
        const cells = run.map(o => `${o.letter}) ${escHtml(o.text)}`);
        const ind = indent || '1.1em';

        /* Word (and other plain-HTML importers) ignore flexbox, grid and padding, which
           would leave the choices at the margin and even run them together. There the
           choices are a borderless table: each choice in its own cell, and the table
           pushed right by margin-left so the choices line up under the first word of
           the question rather than under its number. */
        if (forWord) {
          const indPt = (Math.round(parseFloat(ind) * 11 * 10) / 10) + 'pt';
          const chip = (c) => kid ? `<div style="background-color:#FEF3C7;border:1pt solid #FDE68A;border-radius:6pt;padding:2pt 8pt;">${c}</div>` : c;
          const cell = (c, last) => `<td style="border:none;vertical-align:top;padding:2pt ${last ? '0' : '24pt'} 2pt 0;">${chip(c)}</td>`;
          let rows = '';
          if (mode === 'row') {
            rows = '<tr>' + cells.map((c, i) => cell(c, i === cells.length - 1)).join('') + '</tr>';
          } else if (mode === 'grid2') {
            for (let i = 0; i < cells.length; i += 2) {
              const pair = cells.slice(i, i + 2);
              rows += '<tr>' + pair.map((c, j) => cell(c, j === pair.length - 1)).join('') + '</tr>';
            }
          } else {
            rows = cells.map((c) => '<tr>' + cell(c, true) + '</tr>').join('');
          }
          return `<div class="mcq-opts" style="margin:4pt 0;"><table style="border-collapse:collapse;border:none;margin:0 0 0 ${indPt};"><tbody>${rows}</tbody></table></div>`;
        }

        let inner = '';
        const optStyle = kid ? 'display:inline-block;background:#FEF3C7;border:2px solid #FDE68A;border-radius:12px;padding:6px 14px;margin:4px 0;' : 'text-indent:-1.5em;padding-left:1.5em;margin:2pt 0;';
        if (mode === 'row') {
          inner = `<div style="display:flex;flex-wrap:wrap;gap:0 28pt;">` + cells.map(c => `<span style="white-space:nowrap;${optStyle}">${c}</span>`).join('') + `</div>`;
        } else if (mode === 'grid2') {
          inner = `<div style="display:grid;grid-template-columns:1fr 1fr;column-gap:28pt;row-gap:4pt;">` + cells.map(c => `<div style="${optStyle}">${c}</div>`).join('') + `</div>`;
        } else {
          inner = `<div style="display:flex;flex-direction:column;gap:4pt;">` + cells.map(c => `<div style="${optStyle}">${c}</div>`).join('') + `</div>`;
        }
        return `<div class="mcq-opts" style="margin:4pt 0;padding-left:${ind};">${inner}</div>`;
      };
      /* A numbered item: "___ 1.", "1.", "(1)" — the stem a choice run hangs from. */
      const QUESTION_RE = /^(\s*(?:_{3,}\s*)?\(?\d+[.)])(\s+)(\S[\s\S]*)$/;
      /* One MCQ as a single two-column grid block: the item number takes the narrow first
         column, the stem and every choice take the second, so wrapped lines of the question
         and all four choices start together at the first word of the stem. Word renders
         neither grid nor flexbox, so the flat .doc/.docx keeps the indented table below. */
      const wrapQuestion = (line, optsHtml) => {
        const m = line.match(QUESTION_RE);
        if (!m) return null;
        const num = m[1].trim();
        const stem = line.slice(m[1].length + m[2].length);
        return '<div class="mcq"><div class="mcq-num">' + num +
               '</div><div class="mcq-body">' + stem + optsHtml + '</div></div>';
      };
      const convertOptions = (md, forWord, kid) => {
        const lines = md.split('\n');
        const out = [];
        const collectRun = (from) => {
          const run = [];
          let j = from;
          while (j < lines.length) {
            const m = lines[j].match(OPT_RE);
            if (m) { run.push({ letter: m[1].toUpperCase(), text: m[2].trim() }); j++; }
            else break;
          }
          return { run, end: j };
        };
        let i = 0;
        while (i < lines.length) {
          /* A numbered stem followed straight by its choice run is one question: take it
             as a unit so the grid can own the number as well as the stem. */
          if (!forWord && QUESTION_RE.test(lines[i])) {
            const first = collectRun(i + 1);
            if (first.run.length >= 2 && isSequential(first.run)) {
              /* the grid does the indenting, so the choice block needs no indent of its own */
              out.push(wrapQuestion(lines[i], renderOptions(first.run, '0', false, kid)));
              i = first.end;
              continue;
            }
          }
          const rest = collectRun(i);
          if (rest.run.length >= 2 && isSequential(rest.run)) {
            out.push(renderOptions(rest.run, optionIndent(lines, i), forWord, kid));
            i = rest.end;
            continue;
          }
          out.push(lines[i]);
          i++;
        }
        return out.join('\n');
      };

      /* `$...$` formulas must survive the Markdown passes below untouched: a pipe in
         $|x|$ would split a table, an asterisk in $a*b$ would start emphasis, and a
         newline inside $$...$$ would become <br>. Each span is swapped for a token with
         no Markdown-significant characters and put back verbatim afterwards, so a false
         positive (a price, say) costs nothing — the original text is restored exactly. */
      const MATH_TOKEN_RE = /@@M(\d+)@@/g;
      const extractMath = (src) => {
        const spans = [];
        const keep = (m) => { spans.push(m); return '@@M' + (spans.length - 1) + '@@'; };
        const text = String(src || '').replace(/\r\n/g, '\n')
          .replace(/@@M\d+@@/g, '') /* never let a stray token in the source hijack the restore */
          .replace(/\$\$[\s\S]*?\$\$/g, keep)
          .replace(/\$[^$\n]*?\$/g, keep);
        return { text, spans };
      };
      const restoreMath = (html, spans, asEquations) => String(html).replace(MATH_TOKEN_RE, (m, i) => {
        if (spans[i] === undefined) return m;
        const span = spans[i];
        if (asEquations) {
          /* Word reads a <math> element out of the exported HTML and converts it to a
             native equation, so the span goes back as MathML built from its TeX. A TeX
             error keeps the literal text instead — a formula is never lost. */
          const display = span.startsWith('$$');
          try {
            return window.MathJax.tex2mml(display ? span.slice(2, -2) : span.slice(1, -1), { display });
          } catch (e) { console.warn('tex2mml failed, keeping the literal formula:', e); }
        }
        /* A `<` inside a formula would otherwise open a tag — `$a<b$` starts <b> — so
           the span goes back HTML-escaped. The parser turns it straight back into
           text, and MathJax reads the formula from textContent, so nothing is lost. */
        return span.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      });

      /* An inline <svg> figure needs the same protection as a formula: the passes
         below turn every newline into <br>, and <br> is an HTML breakout tag that
         closes the <svg> and discards the rest of the drawing — a multi-line cube
         would lose all four of its paths. The block is tokenised and put back
         verbatim after the Markdown passes, before the formulas are restored. */
      const SVG_TOKEN_RE = /@@S(\d+)@@/g;
      const extractSvg = (src) => {
        const spans = [];
        const keep = (m) => { spans.push(m); return '@@S' + (spans.length - 1) + '@@'; };
        const text = String(src || '').replace(SVG_TOKEN_RE, '').replace(/<svg[\s\S]*?<\/svg\s*>/gi, keep);
        return { text, spans };
      };
      const restoreSvg = (html, spans) => String(html).replace(SVG_TOKEN_RE, (m, i) =>
        spans[i] === undefined ? m : spans[i]);

      const formatMarkdown = (text, forWord, kid) => {
        if(!text) return {__html:''};
        const math = extractMath(text);
        const svg = extractSvg(math.text);
        const html = restoreMath(restoreSvg(convertOptions(convertTables(svg.text), forWord, kid)
          .replace(/\[SCENARIO_START\]\s*([\s\S]*?)\s*\[SCENARIO_END\]/gim,'<div class="scenario-box">$1</div>')
          .replace(/^### (.*$)/gim, kid ? '<h3 class="text-2xl font-bold mt-6 mb-3 text-pink-600 border-b-2 border-pink-100 pb-1">$1</h3>' : '<h3 class="text-xl font-bold mt-6 mb-3 text-iris-700 border-b border-black/10 pb-1">$1</h3>')
          .replace(/^## (.*$)/gim, kid ? '<h2 class="text-3xl font-extrabold mt-8 mb-4 text-purple-600 border-b-4 border-purple-200 pb-2 rounded-sm">$1</h2>' : '<h2 class="text-2xl font-bold mt-8 mb-4 text-ink border-b-2 border-iris-200 pb-2">$1</h2>')
          .replace(/^# (.*$)/gim, kid ? '<h1 class="text-4xl font-black mt-8 mb-6 text-center text-cyan-600 drop-shadow-sm">$1</h1>' : '<h1 class="font-display text-3xl font-semibold mt-8 mb-4 text-center text-ink">$1</h1>')
          .replace(/\*\*(.*?)\*\*/gim,'<strong class="text-ink">$1</strong>')
          .replace(/\*(.*?)\*/gim,'<em>$1</em>')
          .replace(/^\s*-\s(.*)/gim, kid ? '<li class="ml-6 list-none mb-2 flex items-start gap-2 before:content-[\'⭐\'] before:mr-1">$1</li>' : '<li class="ml-6 list-disc mb-1">$1</li>')
          .replace(/ {4,}/g,(m)=>'&nbsp;'.repeat(m.length))
          .replace(/\n/gim,'<br />'), svg.spans), math.spans,
          !!(forWord && mathMode && window.MathJax && typeof window.MathJax.tex2mml === 'function'));
        return {__html:html};
      };

      /* Inline math warnings: every finding is tagged onto its own source line as
         a token (the same trick extractMath uses), the tagged text goes through
         formatMarkdown, and the tokens come back out as amber chips — so the
         warning sits next to the item that caused it, not only in the banner.
         A finding inside a $$…$$ block moves to the line after it: a token inside
         the formula would be typeset as TeX. */
      const MATH_WARN_RE = /@@W(\d+)@@/g;
      const applyMathWarnings = (text, details) => {
        const chips = [];
        if (!text || !details || !details.length) return { text, chips };
        const src = String(text).replace(/\r\n/g, '\n');
        const lines = src.split('\n');
        const lineAt = (s, i) => (s.slice(0, i).match(/\n/g) || []).length;
        const ranges = [];
        const dispRe = /\$\$[\s\S]*?\$\$/g;
        let dm;
        while ((dm = dispRe.exec(src))) ranges.push([lineAt(src, dm.index), lineAt(src, dm.index + dm[0].length)]);
        details.forEach((d) => {
          if (typeof d.line !== 'number' || d.line < 0 || d.line >= lines.length) return;
          let at = d.line;
          for (let tries = 0; tries < 2; tries++) {
            const hit = ranges.find((r) => at >= r[0] && at <= r[1]);
            if (!hit) break;
            at = (hit[1] + 1 < lines.length) ? hit[1] + 1 : hit[0] - 1;
          }
          if (at < 0 || ranges.some((r) => at >= r[0] && at <= r[1])) return;
          chips.push(d.message);
          lines[at] += '@@W' + (chips.length - 1) + '@@';
        });
        return { text: lines.join('\n'), chips };
      };
      const renderMathChips = (html, chips) => !chips.length ? html : String(html).replace(MATH_WARN_RE, (m, i) =>
        chips[i] === undefined ? '' :
          '<code class="math-warn-chip" title="' + escHtml(chips[i]).replace(/"/g, '&quot;') + '">' + escHtml(chips[i]) + '</code>');
      const buildPreviewHtml = () => {
        const w = applyMathWarnings(generatedTest, mathWarnDetails);
        return buildTestHeader() + renderMathChips(formatMarkdown(w.text, false, k3Mode).__html, w.chips);
      };

      /* ============================================================
         SIMPLIFIED ITEM ANALYSIS (Excel-style) report model

         Mirrors Item-Analysis-*.xlsx: the DepEd school block read from
         Settings, a header block (School / School Year / Subject / Grading
         Period), one table row per section, a "Total" row and an "MPS per
         Item" row, then the signatories block from Settings.
         ============================================================ */
      const IA_TITLE = 'SIMPLIFIED ITEM ANALYSIS PER SUBJECT';

      const iaBlankScores = (n) => Array.from({ length: n }, (_, i) => ({ itemNo: i + 1, score: '', competency: '' }));
      const iaNewSection = (n) => ({ name: '', takers: 50, scores: iaBlankScores(n) });
      const iaNum = (v) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : 0; };
      const iaFixed = (n, d) => (Number(n) || 0).toFixed(d);
      const iaTrim = (n) => String(Math.round((Number(n) || 0) * 100) / 100);

      /* One Excel data row: raw counts exactly as entered (the workbook
         itself never clamps them against the number of takers). */
      const iaSectionRow = (sec, items) => {
        const takers = iaNum(sec.takers);
        const scores = Array.from({ length: items }, (_, i) => {
          const raw = Number((sec.scores[i] || {}).score) || 0;
          return raw > 0 ? raw : 0;
        });
        const raw = scores.reduce((a, b) => a + b, 0);
        const mps = takers > 0 ? raw / takers : 0;              // AK column
        const mastery = items > 0 ? (mps / items) * 100 : 0;    // AL column
        return { name: String(sec.name || '').trim(), takers, scores, raw, mps, mastery };
      };

      const iaBuildModel = (meta, sections, items) => {
        const all = sections.map(s => iaSectionRow(s, items));
        const filled = all.filter(r => r.name !== '' || r.takers > 0 || r.scores.some(v => v > 0));
        const rows = filled.length ? filled : all.slice(0, 1);
        const perItem = Array.from({ length: items }, (_, i) => rows.reduce((a, r) => a + (r.scores[i] || 0), 0));
        const totalTakers = rows.reduce((a, r) => a + r.takers, 0);
        const totalRaw = perItem.reduce((a, b) => a + b, 0);
        const mps = totalTakers > 0 ? totalRaw / totalTakers : 0;
        const mastery = items > 0 ? (mps / items) * 100 : 0;
        // Per-item contribution to the MPS, over all takers, so the row adds up
        // to the mastery figure. (The workbook divides by the first section only.)
        const mpsPerItem = perItem.map(v => (totalTakers > 0 && items > 0) ? (v / totalTakers) / items * 100 : 0);
        return { meta, rows, items, perItem, totalTakers, totalRaw, mps, mastery, mpsPerItem };
      };

      /* ============================================================
         Reading the competencies

         A TOS is read WITHOUT the AI first, so mapping works offline and
         never depends on a key. Handles the layouts teachers actually use:
           - numbered lists   "1. Identifies the main idea"
                              "Item 2: Solves quadratic equations"
           - item ranges      "1-5. Uses context clues"
           - TOS table rows   "Defines media literacy | 1-5 | 6-8 |30"
                              (cells keep " | " separators from the extractor)
         Returns one string per test item ("" when nothing was found).
         ============================================================ */
      const IA_NUM_CELL = /^\d+(?:\s*[-–—,]\s*\d+)*$/;

      const iaNumberList = (cell) => {
        const out = [];
        const parts = String(cell).replace(/[–—]/g, '-').split(',');
        for (const part of parts) {
          const t = part.trim();
          if (!t) continue;
          const range = t.match(/^(\d+)\s*-\s*(\d+)$/);
          if (range) {
            let a = Number(range[1]), b = Number(range[2]);
            if (a > b) { const s = a; a = b; b = s; }
            if (b - a <= 500) for (let n = a; n <= b; n++) out.push(n);
            continue;
          }
          if (/^\d+$/.test(t)) out.push(Number(t));
        }
        return out;
      };

      /* A subject name is NEVER a competency. A ToS row repeats the subject
         cell, and when it is the longest text in the row the table parser
         below used to return it instead of the competency. Compare loosely
         (case, punctuation, spacing). */
      const iaIsSubject = (comp, meta) => {
        const norm = (s) => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, '');
        const v = norm(comp);
        if (v.length < 3) return false;
        return [meta && meta.subject, meta && meta.subjectCode]
          .map(norm).filter(Boolean).some(k => v === k);
      };

      const iaParseCompetencies = (text, itemCount, meta) => {
        const map = Array.from({ length: itemCount }, () => '');
        // First mapping wins, so a repeated item never overwrites a good entry.
        const assign = (nums, comp) => {
          const clean = String(comp || '').replace(/\s+/g, ' ').trim();
          if (clean.length < 4) return;
          for (const n of nums) {
            if (n >= 1 && n <= itemCount && !map[n - 1]) map[n - 1] = clean;
          }
        };
        /* Cells naming the SUBJECT or a column header. They sit in every ToS
           row, and the "longest text wins" rule could hand them back as if
           they were the competency — which is how the subject name ended up
           in the list of competencies. */
        const norm = (s) => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, '');
        const subjKeys = [meta && meta.subject, meta && meta.subjectCode]
          .map(norm).filter(k => k.length >= 3);
        const HEADER_KEYS = ['subject', 'gradelevel', 'grade', 'section', 'learningarea',
          'learningcompetency', 'learningcompetencies', 'competency', 'content', 'topic',
          'testitemno', 'testitemnumber', 'itemno', 'noofitems', 'weight', 'desiredoutcome',
          'percentage', 'total'];
        const isSubjectish = (cell) => {
          const k = norm(cell);
          if (!k) return true;                      // blank / dash-only cells
          if (HEADER_KEYS.includes(k)) return true;
          if (subjKeys.some(s => k === s)) return true;
          // the subject spelled out with decoration:
          // "MIL - Media Information Literacy"
          return subjKeys.some(s => s.length >= 8 && k.includes(s));
        };
        const lines = String(text || '').replace(/\r/g, '').split('\n');
        for (const raw of lines) {
          const line = raw.trim();
          if (!line) continue;
          if (line.includes('|')) {
            const cells = line.split('|').map(c => c.trim()).filter(Boolean);
            const numCells = cells.filter(c => IA_NUM_CELL.test(c));
            if (!numCells.length) continue;
            // The longest text cell is the competency — but only among
            // cells that are not the subject or a column header; in a wide
            // row the last pure-number cell is the "Total" column, not an
            // item number.
            const texts = cells.filter(c => !IA_NUM_CELL.test(c) && !isSubjectish(c));
            if (!texts.length) continue;
            const comp = texts.reduce((a, b) => (b.length > a.length ? b : a), '');
            let used = numCells;
            if (numCells.length > 1) used = numCells.slice(0, -1);
            else if (cells.length >= 4) used = [];
            assign(used.flatMap(iaNumberList), comp);
            continue;
          }
          const m =
            line.match(/^item\s*(\d+)\s*[:\-–.)]\s*(.+)$/i) ||
            line.match(/^(\d+)\s*[-–]\s*(\d+)\s*[.):\-–]?\s+(.+)$/) ||
            line.match(/^(\d+)\s*[.)]\s*(.+)$/);
          if (!m) continue;
          const nums = m.length === 4 ? iaNumberList(m[1] + '-' + m[2]) : iaNumberList(m[1]);
          assign(nums, m[m.length - 1]);
        }
        return map;
      };

      const ItemAnalyzer = () => {
        const [step, setStep] = useState(0);
        const [tosFile, setTosFile] = useState(null);
        const [manualCompetencies, setManualCompetencies] = useState('');
        const [useManualCompetencies, setUseManualCompetencies] = useState(false);
        /* The file browser only appears once the teacher has picked Upload or
           Manual Entry — nothing to browse before a source is chosen. */
        const [iaSourcePicked, setIaSourcePicked] = useState(false);

        const [itemCount, setItemCount] = useState(10);
        // Scratch value for the "fill every item at once" control.
        const [fillScore, setFillScore] = useState('');
        // One entry per section — the Excel sheet prints one table row each.
        const [sections, setSections] = useState(() => [iaNewSection(10)]);
        const [activeIdx, setActiveIdx] = useState(0);
        const [meta, setMeta] = useState({
          schoolYear: '2025-2026',
          subject: 'MEDIA INFORMATION LITERACY',
          subjectCode: 'MIL',
          gradingPeriod: 'SECOND',
          gradeLevel: '12',
          // used by the DepEd annex exports; school + signatories live in Settings
          assessment: '',
          // which annex checkbox (ST-1 / ST-2 / TE) gets ticked on the exports
          assessmentType: ''
        });

        const [isDragging, setIsDragging] = useState(false);
        const [errorMsg, setErrorMsg] = useState('');
        const [loadingStatus, setLoadingStatus] = useState('');

        const [results, setResults] = useState([]);
        const [summaryStats, setSummaryStats] = useState({});
        const [aiInsight, setAiInsight] = useState('');
        const [leastMastered, setLeastMastered] = useState([]);
        const [overallScores, setOverallScores] = useState({ mean: 0, mps: 0 });

        // The competency mapping the teacher reviews (step 3) before the report.
        const [reviewComps, setReviewComps] = useState([]);
        const [reviewNote, setReviewNote] = useState('');

        // Derived: the section being edited, plus class-wide totals.
        const currentSection = sections[activeIdx] || sections[0];
        const manualScores = currentSection.scores;
        const sectionTakers = iaNum(currentSection.takers);
        const totalLearners = sections.reduce((a, s) => a + iaNum(s.takers), 0);

        useEffect(() => {
          const loadScript = (src) => {
            if (!document.querySelector(`script[src="${src}"]`)) {
              const s = document.createElement('script'); s.src = src; s.async = true; document.body.appendChild(s);
            }
          };
          loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
          loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
        }, []);

        const getMasteryLevel = (pct) => {
          if (pct >= 90) return 'High Mastery';
          if (pct >= 70) return 'Moderately Average Mastery';
          if (pct >= 50) return 'Average Mastery';
          if (pct >= 20) return 'Low Mastery';
          return 'No Mastery';
        };

        const getMasteryBadge = (level) => {
          switch (level) {
            case 'High Mastery': return 'bg-emerald-500/10 text-emerald-600 border-emerald-500/20';
            case 'Moderately Average Mastery': return 'bg-blue-500/10 text-blue-600 border-blue-500/20';
            case 'Average Mastery': return 'bg-yellow-500/10 text-yellow-600 border-yellow-500/20';
            case 'Low Mastery': return 'bg-orange-500/10 text-orange-600 border-orange-500/20';
            case 'No Mastery': return 'bg-rose-500/10 text-rose-600 border-rose-500/20';
            default: return 'bg-slate-500/10 text-slate-500 border-slate-500/20';
          }
        };

        const getBarColor = (pct) => {
          if (pct >= 90) return 'bg-emerald-500';
          if (pct >= 70) return 'bg-blue-500';
          if (pct >= 50) return 'bg-yellow-500';
          if (pct >= 20) return 'bg-orange-500';
          return 'bg-rose-500';
        };

        const handleItemCountChange = (e) => {
          const count = Math.max(1, Math.min(200, parseInt(e.target.value) || 1));
          setItemCount(count);
          setSections(prev => prev.map(s => ({
            ...s,
            scores: Array.from({ length: count }, (_, i) => s.scores.find(x => x.itemNo === i + 1) || { itemNo: i + 1, score: '', competency: '' })
          })));
        };

        // One value typed once, applied to every item of every section.
        const applyFillScore = () => {
          const raw = String(fillScore).trim();
          if (raw === '') return;
          const val = Number(raw);
          if (!Number.isFinite(val) || val < 0) return;
          setSections(prev => prev.map(s => {
            const cap = iaNum(s.takers);
            const v = cap ? Math.min(val, cap) : val;
            return { ...s, scores: s.scores.map(sc => ({ ...sc, score: String(v) })) };
          }));
        };

        const handleScoreChange = (index, field, value) => {
          setSections(prev => prev.map((s, si) => {
            if (si !== activeIdx) return s;
            const scores = [...s.scores];
            scores[index] = { ...scores[index], [field]: value };
            return { ...s, scores };
          }));
        };

        const updateSection = (idx, patch) => setSections(prev => prev.map((s, i) => (i === idx ? { ...s, ...patch } : s)));
        const addSection = () => {
          setSections(prev => [...prev, iaNewSection(itemCount)]);
          setActiveIdx(sections.length);
        };
        const removeSection = (idx) => {
          if (sections.length <= 1) return;
          const next = sections.filter((_, i) => i !== idx);
          setSections(next);
          setActiveIdx(prev => Math.max(0, Math.min(idx < prev ? prev - 1 : prev, next.length - 1)));
        };
        const setMetaField = (key, value) => setMeta(prev => ({ ...prev, [key]: value }));

        const handleCompetencyToggle = () => {
          setUseManualCompetencies(!useManualCompetencies);
          setIaSourcePicked(true); // choosing Manual Entry counts as a source pick
          if (!useManualCompetencies) setErrorMsg('');
        };

        const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
        const handleDragLeave = () => { setIsDragging(false); };
        const handleDrop = (e) => {
          e.preventDefault(); setIsDragging(false);
          const file = e.dataTransfer.files[0];
          if (file) setTosFile(file);
        };
        const handleFileSelect = (e) => {
          const file = e.target.files[0];
          if (file) setTosFile(file);
        };

        /* Mammoth gives real HTML — keep the table grid (" | " per cell, one
           line per row) so the competency mapper can follow a TOS table. */
        const iaHtmlToText = (html) => {
          let t = String(html);
          t = t.replace(/<li[^>]*>/gi, '\n- ');
          // Cell/row ends become " | " and newline sentinels FIRST, so the
          // paragraph breaks *inside* a cell cannot split the row apart.
          t = t.replace(/<\/td>|<\/th>/gi, '\u0001').replace(/<\/tr>/gi, '\u0002');
          t = t.replace(/<\/(p|div|h[1-6])>/gi, '\n');
          t = t.replace(/\n\s*\u0001/g, '\u0001').replace(/\u0001\s*\n/g, '\u0001');
          t = t.replace(/\n\s*\u0002/g, '\u0002').replace(/\u0002\s*\n/g, '\u0002');
          t = t.replace(/\u0001/g, ' | ').replace(/\u0002/g, '\n');
          return t
            .replace(/<[^>]+>/g, '')
            .replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/&lt;/gi, '<')
            .replace(/&gt;/gi, '>').replace(/&quot;/gi, '"').replace(/&#(\d+);/g, (_, d) => String.fromCharCode(Number(d)))
            .replace(/[ \t]+/g, ' ')
            .split('\n').map(l => l.trim()).filter(Boolean).join('\n');
        };

        /* Turn the uploaded TOS into readable text. Throws with a friendly
           message when the file cannot be used, instead of returning junk. */
        const extractTosText = async (file) => {
          const ext = (file.name.split('.').pop() || '').toLowerCase();
          const CAP = 40000;

          if (ext === 'pdf') {
            if (!window.pdfjsLib) throw new Error('The PDF reader has not loaded yet — check your connection and try again.');
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            const ab = await file.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: ab }).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const tc = await page.getTextContent();
              fullText += tc.items.map(it => it.str).join(' ') + '\n';
            }
            if (fullText.trim().length < 40) {
              throw new Error('This PDF has no readable text — it looks like a scanned image. Re-save the TOS as a Word (.docx) file, or type the competencies with Manual Entry.');
            }
            return fullText.substring(0, CAP);
          }

          if (ext === 'docx' || ext === 'doc') {
            if (!window.mammoth) throw new Error('The Word reader has not loaded yet — check your connection and try again.');
            const oldDocMsg = 'This is an old ".doc" file, which cannot be read here. Open it in Word and choose File > Save As, pick ".docx", then upload it again.';
            const ab = await file.arrayBuffer();
            let html = '';
            try {
              const r = await window.mammoth.convertToHtml({ arrayBuffer: ab });
              html = r.value;
            } catch (err) {
              throw new Error(ext === 'doc' ? oldDocMsg : 'This Word file could not be read — it may be corrupted. Try re-saving it and uploading again.');
            }
            const text = iaHtmlToText(html);
            if (text.trim()) return text.substring(0, CAP);
            throw new Error(ext === 'doc' ? oldDocMsg : 'This Word file appears to be empty.');
          }

          // .txt (and anything else): read as plain text, nothing stripped
          const text = await file.text();
          return text.substring(0, CAP);
        };

        /* Ask the AI to fill only the items the TOS text did not give us.
           Already-found mappings are passed along as hints it must keep. */
        const aiFillCompetencies = async (tosText, mapped, missing) => {
          const prompt = `
You are an expert Educational Data Analyzer.
Below is text from a Table of Specifications (TOS). The test has ${itemCount} items.

ITEMS ALREADY MAPPED — keep these exactly as given:
${mapped.map((c, i) => (c ? `Item ${i + 1}: ${c}` : '')).filter(Boolean).join('\n') || '(none)'}

ITEMS STILL MISSING — fill these in: ${missing.join(', ')}

TOS TEXT:
${tosText.substring(0, 12000)}

TASK:
Return a JSON array covering ONLY the missing items, using the exact competency wording from the TOS.
Do not make up competencies. If an item is not covered by the TOS, use "Unspecified Competency".

OUTPUT: Valid JSON array only, no markdown.
Structure: [ { "itemNo": 3, "competency": "..." } ]
          `;
          const raw = await window.SilidAPI.callGemini({
            prompt,
            responseMimeType: 'application/json',
            temperature: 0.2
          });
          if (!raw) throw new Error('the AI returned nothing');
          const jsonText = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
          const start = jsonText.indexOf('[');
          const end = jsonText.lastIndexOf(']');
          const parsed = JSON.parse(start >= 0 && end > start ? jsonText.slice(start, end + 1) : jsonText);
          if (!Array.isArray(parsed)) throw new Error('the AI returned unexpected data');
          const out = Array.from({ length: itemCount }, () => '');
          parsed.forEach(p => {
            const n = Number(p && p.itemNo);
            const comp = p && typeof p.competency === 'string' ? p.competency.trim() : '';
            if (n >= 1 && n <= itemCount && comp) out[n - 1] = comp;
          });
          return out;
        };

        /* Step 1 → 2 → 3: read the competencies and map them to items, then
           hand the mapping to the review step. The reading itself is local —
           the AI is only asked to fill gaps, and only when a key is set. */
        const analyzeData = async () => {
          if (!useManualCompetencies && !tosFile) {
            setErrorMsg('Please upload a TOS document, or switch to manual competency entry.');
            return;
          }
          if (totalLearners <= 0) {
            setErrorMsg('Enter the number of takers for at least one section so percentages can be calculated.');
            return;
          }
          setStep(2);
          setErrorMsg('');
          try {
            let mapped = [];
            let note = '';
            if (useManualCompetencies) {
              setLoadingStatus('Reading your competency list...');
              mapped = iaParseCompetencies(manualCompetencies, itemCount, meta);
              // per-item boxes from the score grid still count
              sections[0].scores.forEach((s, i) => {
                if (!mapped[i] && s.competency) mapped[i] = s.competency;
              });
              // safety net: the subject must never survive as a competency
              mapped = mapped.map(c => (iaIsSubject(c, meta) ? '' : c));
              if (mapped.every(c => !c)) {
                throw new Error('No competencies were read from your list. Type one per line, e.g. "1. Identifies the main idea" — no API key is needed.');
              }
            } else {
              setLoadingStatus('Extracting text from TOS document...');
              const tosText = await extractTosText(tosFile);
              if (!tosText.trim()) throw new Error('The TOS document appears empty or unreadable.');
              setLoadingStatus('Matching competencies to items...');
              mapped = iaParseCompetencies(tosText, itemCount, meta);
              // safety net: the subject must never survive as a competency
              mapped = mapped.map(c => (iaIsSubject(c, meta) ? '' : c));
              const missing = mapped.reduce((a, c, i) => { if (!c) a.push(i + 1); return a; }, []);
              if (missing.length && apiKey.trim()) {
                setLoadingStatus(`AI is filling in ${missing.length} remaining item${missing.length === 1 ? '' : 's'}...`);
                try {
                  const filled = await aiFillCompetencies(tosText, mapped, missing);
                  mapped = mapped.map((c, i) => c || filled[i] || '');
                  // the AI reads the TOS header too — keep the subject out
                  mapped = mapped.map(c => (iaIsSubject(c, meta) ? '' : c));
                } catch (err) {
                  note = `The AI could not fill in the remaining items (${err.message}). You can type them below.`;
                }
              } else if (missing.length && mapped.every(c => !c)) {
                throw new Error('No competencies could be read from this file. Add your Gemini API key so the AI can read it, or type the competencies with Manual Entry.');
              } else if (missing.length) {
                note = `${missing.length} item${missing.length === 1 ? ' was' : 's were'} not found in the TOS — type ${missing.length === 1 ? 'it' : 'them'} below.`;
              }
            }
            setReviewComps(mapped.map(c => c || 'Unspecified Competency'));
            setReviewNote(note);
            setStep(3);
          } catch (err) {
            console.error(err);
            setErrorMsg(err.message || 'The competencies could not be read.');
            setStep(1);
          }
        };

        /* Step 3 → 4: the competencies were confirmed on the review screen —
           compute the mastery figures and build the report. */
        const finishAnalysis = () => {
          setErrorMsg('');
          try {
            const compList = reviewComps.map(c => String(c || '').trim() || 'Unspecified Competency');
            let finalData = [];
            const counts = { 'High Mastery': 0, 'Moderately Average Mastery': 0, 'Average Mastery': 0, 'Low Mastery': 0, 'No Mastery': 0 };

            // Correct responses pooled across every section, as entered.
            const pooledCorrect = manualScores.map((_, i) => sections.reduce((sum, s) => {
              const raw = Number((s.scores[i] || {}).score) || 0;
              return sum + (raw > 0 ? raw : 0);
            }, 0));

            manualScores.forEach((ms, idx) => {
              const comp = compList[idx] || `Item ${ms.itemNo}`;
              const safeCorrect = pooledCorrect[idx] || 0;
              const pct = totalLearners > 0 ? (safeCorrect / totalLearners) * 100 : 0;
              const mastery = getMasteryLevel(pct);
              counts[mastery]++;
              finalData.push({
                itemNo: ms.itemNo,
                competency: comp,
                correctResponses: safeCorrect,
                percentage: pct.toFixed(2),
                masteryLevel: mastery
              });
            });

            const totalCorrect = finalData.reduce((a, c) => a + c.correctResponses, 0);
            const mean = totalLearners > 0 ? totalCorrect / totalLearners : 0;
            const mps = (mean / itemCount) * 100;
            setOverallScores({ mean: mean.toFixed(2), mps: mps.toFixed(2) });

            const compGroups = {};
            finalData.forEach(it => {
              if (!compGroups[it.competency]) compGroups[it.competency] = { total: 0, n: 0 };
              compGroups[it.competency].total += parseFloat(it.percentage);
              compGroups[it.competency].n += 1;
            });
            const compAvg = Object.keys(compGroups).map(c => ({ competency: c, average: (compGroups[c].total / compGroups[c].n).toFixed(2) }));
            compAvg.sort((a, b) => parseFloat(a.average) - parseFloat(b.average));
            setLeastMastered(compAvg.slice(0, 5));

            let insight = `Based on ${totalLearners} learners across ${finalData.length} items: `;
            if (counts['High Mastery'] >= finalData.length * 0.5) insight += 'Over half the items reached High Mastery — excellent class understanding. ';
            else if (counts['No Mastery'] + counts['Low Mastery'] > finalData.length * 0.4) insight += 'Many competencies show Low or No Mastery — reteaching is recommended. ';
            else insight += 'Overall performance is in the Average to Moderately Average range. ';
            const hardest = [...finalData].sort((a, b) => parseFloat(a.percentage) - parseFloat(b.percentage))[0];
            if (hardest) insight += `Most challenging: Item ${hardest.itemNo} ("${hardest.competency}" — ${hardest.percentage}% correct).`;
            setAiInsight(insight);

            setResults(finalData);
            setSummaryStats(counts);
            setStep(4);
          } catch (err) {
            console.error(err);
            setErrorMsg(err.message || 'Analysis failed.');
          }
        };

        const resetAnalyzer = () => {
          setStep(1);
          setTosFile(null);
          setSections([iaNewSection(itemCount)]);
          setActiveIdx(0);
          setResults([]);
          setLeastMastered([]);
          setReviewComps([]);
          setReviewNote('');
          setOverallScores({ mean: 0, mps: 0 });
          setErrorMsg('');
        };

        const downloadCSV = () => {
          const rows = results.map(r => [r.itemNo, `"${r.competency.replace(/"/g, '""')}"`, r.correctResponses, r.percentage + '%', r.masteryLevel]);
          const csv = 'data:text/csv;charset=utf-8,' + ['Item Number,Competency,Correct Responses,Percentage,Mastery Level', ...rows.map(r => r.join(','))].join('\n');
          const link = document.createElement('a');
          link.href = encodeURI(csv);
          link.download = 'item_analysis_report.csv';
          link.click();
        };

        /* ---- Word export: same layout as the Excel sheet ---------------- */
        const wordFileName = (ext) => 'Item_Analysis_' + String(meta.subjectCode || meta.subject || 'Report').trim().replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '') + ext;

        const saveWordBlob = (blob, name) => {
          if (window.saveAs) { window.saveAs(blob, name); return; }
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = name;
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 5000);
        };

        /* ── Header & signatories for the report ──────────────────────────
           Everything here is read from School & Personal Info (Settings). The
           Item Analysis UI no longer collects school / submitted-by fields, so
           the preview and every export can never drift from Settings. */
        const iaSi = () => schoolInfo || {};

        const iaHeaderLines = () => {
          const si = iaSi();
          const lines = [{ text: 'Republic of the Philippines', size: 9 }];
          lines.push({ text: 'Department of Education', size: 11, bold: true, serif: true });
          const region = si.regionNo || si.regionName
            ? `REGION ${si.regionNo || ''}${si.regionNo && si.regionName ? ' – ' : ''}${si.regionName ? `${si.regionName} REGION` : ''}`
            : '';
          if (region) lines.push({ text: region.toUpperCase(), size: 9, bold: true });
          if (si.division) lines.push({ text: `SCHOOLS DIVISION OFFICE OF ${si.division}`.toUpperCase(), size: 9, bold: true });
          if (si.district) lines.push({ text: (/district/i.test(si.district) ? si.district : `${si.district} District`).toUpperCase(), size: 9, bold: true });
          if (si.schoolName) lines.push({ text: si.schoolName.toUpperCase(), size: 11, bold: true });
          if (si.schoolAddress) lines.push({ text: si.schoolAddress, size: 9 });
          return lines;
        };

        /* Submitted / checked / approved — one list for the preview and Word. */
        const iaSignatories = () => {
          const si = iaSi();
          const list = [
            { label: 'Submitted by', name: si.teacherName, title: si.teacherTitle },
            { label: 'Checked by', name: si.checkedBy, title: si.checkedByPosition },
            { label: 'Submitted to', name: si.approvedBy, title: si.approvedByPosition }
          ].filter(b => b.name);
          // Keep the signature area even before Settings is filled in.
          return list.length ? list : [
            { label: 'Submitted by', name: '', title: '' },
            { label: 'Submitted to', name: '', title: '' }
          ];
        };

        /* Plain JSX (not a component) so re-renders never remount the logos. */
        const iaHeaderJsx = () => (
          <div className="mb-4 text-center">
            {(iaSi().schoolLogo1 || iaSi().schoolLogo2) && (
              <div className="flex items-center justify-center gap-4 mb-2">
                {iaSi().schoolLogo1 && <img src={iaSi().schoolLogo1} alt="" className="h-14 object-contain" />}
                {iaSi().schoolLogo2 && <img src={iaSi().schoolLogo2} alt="" className="h-14 object-contain" />}
              </div>
            )}
            {iaHeaderLines().map((l, i) => (
              <p
                key={i}
                className={`${l.serif ? 'font-serif' : ''} ${l.bold ? 'font-semibold' : ''} uppercase`}
                style={{ fontSize: `${Math.round(l.size * 1.34)}px`, lineHeight: 1.3 }}
              >
                {l.text}
              </p>
            ))}
          </div>
        );

        /* opts.forDoc → a .doc (Word HTML) with a landscape @page rule;
           the .docx path asks html-docx for landscape instead. */
        const buildItemAnalysisHtml = (opts) => {
          const forDoc = !!(opts && opts.forDoc);
          const si = iaSi();
          const m = iaBuildModel(meta, sections, itemCount);
          const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const border = 'border:1px solid #555555;';

          /* Uniform column widths: every numbered item column gets the SAME
             width, written onto each cell (Word autofit used to give item 8 a
             far wider column than its neighbours). Fixed columns keep a little
             more room for their labels. Left block 30 (Subject 7 · Grade 5 ·
             Section 7 · Takers 6 · Items 5) + right block 18 (Raw 6 · MPS 5 ·
             Mastery 7) — the numbered columns share the remaining 52.

             Wide tests are printed in readable BANDS — AT MOST TWO. The
             FIRST band holds the first 30 items and spans the FULL page width
             (no summary block, so its item columns get 70% ÷ 30 — roomier
             than a single grid). Everything after item 30 goes into one second
             band, which repeats the left block and carries the 18% summary
             block. Both bands share ONE item-column width, taken as the
             tighter of "band 1 fills the page" and "band 2 fits the page" —
             so every column lines up exactly from one band to the next, even
             when a very wide band 2 pulls both below full width. */
          const leftFixed = 30;   // Subject 7 · Grade 5 · Section 7 · Takers 6 · Items 5
          const rightFixed = 18;  // Raw 6 · MPS 5 · Mastery 7
          const fixedSum = leftFixed + rightFixed;
          const pct = (n) => Math.round(n * 100) / 100;
          const BAND_ONE = 30;   // band 1: the first 30 items, full page width
          const bands = [];
          if (m.items > 0) {
            bands.push([0, Math.min(m.items, BAND_ONE)]);
            if (m.items > BAND_ONE) bands.push([BAND_ONE, m.items]);
          }
          // One shared item-column width, so every band's columns line up
          // exactly. Band 1 (no summary block) fills the page with 70 ÷ 30
          // per item; band 2 needs 52 ÷ its item count to fit alongside the
          // summary block. Whichever is TIGHTER wins: bands then match
          // perfectly, even if a very wide band 2 pulls both below full
          // width. A single grid still splits the 52 left after both fixed
          // blocks.
          const restN = m.items > BAND_ONE ? m.items - BAND_ONE : 0;
          const itemW = bands.length > 1
            ? Math.min((100 - leftFixed) / BAND_ONE, (100 - fixedSum) / restN)
            : Math.max(1.2, (100 - fixedSum) / Math.max(1, m.items));

          const head = (text) => [text, 1, 'font-weight:bold;background:#e9e9e9;'];
          const cell = (text, span, extra) => [text, span || 1, extra || ''];

          /* The School / Subject / School Year / Grading Period block sits in a
             table OF ITS OWN, so widening one of its cells in Word never moves
             the score grid below (they used to share one column grid). */
          const infoRow = (l1, v1, l2, v2) => {
            const infoCell = (text, w, style) =>
              `<td width="${w}" style="${border}padding:2px 3px;vertical-align:middle;font-size:8pt;width:${w}%;${style}">${esc(text)}</td>`;
            return `<tr>${infoCell(l1, 12, 'font-weight:bold;background:#f3f3f3;text-align:left;')}${infoCell(v1, 38, 'text-align:left;')}${infoCell(l2, 12, 'font-weight:bold;background:#f3f3f3;text-align:left;')}${infoCell(v2, 38, 'text-align:left;')}</tr>`;
          };

          /* One band = one self-contained grid table covering items
             [start, end). It carries the title, its own header row, the section
             rows and the per-item totals for ITS items.

             The summary block (Total Raw Score · MPS · Mastery Level) holds
             WHOLE-TEST values, so it appears only on the LAST band — repeating
             it on earlier bands reads as if those totals described just that
             band's items. Earlier bands simply end after their item columns,
             sharing band 1's column widths so the grids line up vertically. */
          const buildBand = (bandIdx, start, end) => {
            const n = end - start;
            const isLast = bandIdx === bands.length - 1;
            const totalCols = 5 + n + (isLast ? 3 : 0);
            // The single shared itemW applies to BOTH bands, so their item
            // columns line up exactly from one band to the next.
            const colW = (i) => (i < 5 ? [7, 5, 7, 6, 5][i] : i < 5 + n ? itemW : [6, 5, 7][i - 5 - n]);
            const colWidths = Array.from({ length: totalCols }, (_, i) => colW(i));
            const bandW = Math.min(100, pct(colWidths.reduce((a, b) => a + b, 0)));
            // Cells are [text, span, extraStyle]; renderRow keeps a running
            // column cursor so every cell carries the width of its columns.
            const renderRow = (cells) => {
              let idx = 0;
              return `<tr>${cells.map(([text, span, extra]) => {
                const cn = span || 1;
                let width = 0;
                for (let k = idx; k < idx + cn; k++) width += colWidths[k];
                idx += cn;
                const w = pct(width);
                return `<td${cn > 1 ? ` colspan="${cn}"` : ''} width="${w}" style="${border}padding:2px 3px;text-align:center;vertical-align:middle;font-size:8pt;width:${w}%;${extra || ''}">${esc(text)}</td>`;
              }).join('')}</tr>`;
            };

            const dataRows = m.rows.map(r => renderRow([
              cell(meta.subjectCode || meta.subject),
              cell(meta.gradeLevel),
              cell(r.name || 'Section'),
              cell(String(r.takers)),
              cell(String(m.items)),
              ...r.scores.slice(start, end).map(v => cell(String(v))),
              ...(isLast ? [
                cell(String(r.raw), 1, 'font-weight:bold;'),
                cell(String(Math.round(r.mps))),
                cell(iaFixed(r.mastery, 2))
              ] : [])
            ])).join('');

            const totalRow = renderRow([
              cell(''),
              cell('Total', 2, 'font-weight:bold;background:#f3f3f3;'),
              cell(String(m.totalTakers)),
              cell(String(m.items)),
              ...m.perItem.slice(start, end).map(v => cell(String(v))),
              ...(isLast ? [
                cell(String(m.totalRaw), 1, 'font-weight:bold;'),
                cell(String(Math.round(m.mps)), 1, 'font-weight:bold;'),
                cell(iaFixed(m.mastery, 2), 1, 'font-weight:bold;')
              ] : [])
            ]);

            const mpsRow = renderRow([
              cell(''),
              cell('MPS per Item', 3, 'font-weight:bold;background:#f3f3f3;'),
              cell(''),
              ...m.mpsPerItem.slice(start, end).map(v => cell(iaTrim(v))),
              ...(isLast ? [cell(''), cell(''), cell('')] : [])
            ]);

            const headers = renderRow([
              head('Subject'), head('Grade Level'), head('Section'), head('Total No. of Takers'), head('Total No. of Items'),
              ...Array.from({ length: n }, (_, i) => head(String(start + i + 1))),
              ...(isLast ? [head('Total Raw Score'), head('MPS'), head('Mastery Level')] : [])
            ]);

            const title = bandIdx === 0 ? IA_TITLE : `${IA_TITLE} — Items ${start + 1}–${end}`;
            return `<table style="width:${bandW}%;border-collapse:collapse;table-layout:fixed;">
${renderRow([cell(title, totalCols, 'font-weight:bold;padding:4px;')])}
${headers}
${dataRows}
${totalRow}
${mpsRow}
</table>`;
          };

          const logoHtml = (si.schoolLogo1 || si.schoolLogo2)
            ? `<p style="text-align:center;margin:0 0 4pt;">${[si.schoolLogo1, si.schoolLogo2].filter(Boolean).map(src => `<img src="${src}" style="height:50px;" alt="" />`).join('&nbsp;&nbsp;&nbsp;')}</p>`
            : '';
          const headerHtml = '<div style="text-align:center;line-height:1.3;margin-bottom:6pt;">' +
            iaHeaderLines().map(l => `<p style="margin:1pt 0;font-size:${l.size}pt;${l.bold ? 'font-weight:bold;' : ''}${l.serif ? "font-family:'Times New Roman',Georgia,serif;" : ''}">${esc(l.text)}</p>`).join('') +
            '</div>';
          const sigs = iaSignatories();
          const sigW = pct(100 / sigs.length);
          const sigTable = `<table style="width:100%;border-collapse:collapse;margin-top:18pt;"><tr>${
            sigs.map(b => `<td width="${sigW}" style="width:${sigW}%;vertical-align:top;font-size:9pt;padding:0 8pt;">${esc(b.label)}:<br /><br /><br /><b>${esc(b.name)}</b>${b.title ? `<br />${esc(b.title)}` : ''}</td>`).join('')
          }</tr></table>`;
          const pageCss = forDoc
            ? '<style>@page WordSection1 {size:11.0in 8.5in; margin:0.4in;} div.WordSection1 {page:WordSection1;}</style>'
            : '';
          const content = `${logoHtml}${headerHtml}
<table style="width:100%;border-collapse:collapse;table-layout:fixed;">
${infoRow('School:', si.schoolName || '', 'School Year:', meta.schoolYear)}
${infoRow('Subject', meta.subject, 'Term / Grading Period', meta.gradingPeriod)}
</table>
${bands.map(([s, e], i) => buildBand(i, s, e)).join('\n')}
${sigTable}`;
          const body = forDoc ? `<div class="WordSection1">${content}</div>` : content;
          return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">${pageCss}<title>${esc(IA_TITLE)}</title></head><body style="font-family:Arial,Helvetica,sans-serif;font-size:9pt;">${body}</body></html>`;
        };

        const downloadDoc = async () => {
          // @page landscape (see buildItemAnalysisHtml) makes Word print wide.
          const blob = new Blob(['\ufeff', buildItemAnalysisHtml({ forDoc: true })], { type: 'application/msword' });
          saveWordBlob(blob, wordFileName('.doc'));
        };

        const downloadDocx = async () => {
          if (!window.htmlDocx || !window.saveAs) {
            const m = 'The DOCX helper has not loaded yet — exporting .doc instead.';
            if (window.SilidToast) window.SilidToast.warning(m); else console.warn(m);
            await downloadDoc();
            return;
          }
          try {
            const blob = window.htmlDocx.asBlob(buildItemAnalysisHtml({}), {
              orientation: 'landscape',
              margins: { top: 576, bottom: 576, left: 432, right: 432 }
            });
            saveWordBlob(blob, wordFileName('.docx'));
          } catch (e) {
            console.error(e);
            const m = 'Could not build the DOCX file: ' + ((e && e.message) || 'unknown error') + '. Try the .doc button instead.';
            if (window.SilidToast) window.SilidToast.error(m); else alert(m);
          }
        };

        /* ── DepEd annex exports ───────────────────────────────────────────
           Annex 1 (ST-2)      — MPS per Learning Area
           Annex 3 (SS-10)     — School Consolidated List of Least Mastered
                                  Competencies
           Both follow the official templates; school info and signatories are
           read from School & Personal Info (Settings). ── */
        const iaTermLabel = () => {
          const g = String(meta.gradingPeriod || '').trim();
          if (!g) return 'First';
          return g.charAt(0).toUpperCase() + g.slice(1).toLowerCase().replace(/\s*term$/, '');
        };

        /* The annex body only — shared verbatim by the Word exports and the
           on-screen preview, so what the teacher sees is what downloads. */
        const buildAnnexContent = (kind) => {
          const si = iaSi();
          const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const pct = (n) => Math.round(n * 100) / 100;
          const term = iaTermLabel().toUpperCase(); // the templates print "SECOND Term"
          const school = (si.schoolName || '________________').toUpperCase();
          const district = si.district ? (/district/i.test(si.district) ? si.district : `${si.district} District`) : '';
          const m = iaBuildModel(meta, sections, itemCount);
          const border = 'border:1px solid #444444;';

          // [width%, text, extraStyle] — widths follow the official templates.
          const td = (w, text, extra) => `<td width="${w}" style="width:${w}%;${border}padding:5px 6px;vertical-align:middle;font-size:10pt;${extra || ''}">${esc(text)}</td>`;
          const tr = (cells) => `<tr>${cells.map(c => td(c[0], c[1], c[2])).join('')}</tr>`;
          const p = (text, extra) => `<p style="margin:3pt 0;font-size:11pt;${extra || ''}">${esc(text)}</p>`;
          const signTable = (blocks) => {
            const w = pct(100 / blocks.length);
            return `<table style="width:100%;border-collapse:collapse;margin-top:16pt;"><tr>${blocks.map(b =>
              `<td width="${w}" style="width:${w}%;vertical-align:top;font-size:10pt;padding:0 8pt;text-align:center;">${esc(b.label)}: ${esc(b.name || '')}${b.name ? '' : '<br /><br />'}<br />${esc(b.title || '')}</td>`
            ).join('')}</tr></table>`;
          };
          /* (Pls. put check in the box) — one box per assessment code; the
             type picked in Report Details gets the tick. Nested table so Word
             draws the boxes reliably. */
          const checkboxRow = () => {
            const codes = ['ST-1', 'ST-2', 'TE'];
            const sel = String(meta.assessmentType || '').trim().toUpperCase();
            const inner = codes.map(code =>
              `<td style="width:15pt;${border}text-align:center;vertical-align:middle;font-size:9pt;padding:1pt 0;">${sel === code ? '&#10003;' : ''}</td>` +
              `<td style="border:none;padding:0 9pt 0 3pt;font-size:9pt;">${code}</td>`
            ).join('');
            return '<table style="width:100%;border-collapse:collapse;"><tr>' +
              '<td style="font-size:9pt;padding:0;">(Pls. put check in the box)</td>' +
              `<td style="padding:0;text-align:right;"><table style="border-collapse:collapse;"><tr>${inner}</tr></table></td>` +
              '</tr></table>';
          };
          /* Left: "Name of School: …". Right area: the Assessment Conducted
             line together with the (Pls. put check in the box) ST-1 / ST-2 /
             TE checkboxes — both moved to the right-hand side, matching the
             template. A borderless table keeps the halves aligned in Word. */
          const nameSchoolRow = () =>
            '<table style="width:100%;border-collapse:collapse;"><tr>' +
            `<td width="45" style="width:45%;border:none;padding:0 12pt 0 0;font-size:11pt;text-align:left;vertical-align:top;">${esc(`Name of School: ${school}`)}</td>` +
            '<td width="55" style="width:55%;border:none;padding:0;font-size:11pt;text-align:right;vertical-align:top;">' +
            `<p style="margin:3pt 0;">${esc(`Assessment Conducted: ${meta.assessment || ''}`)}</p>` +
            checkboxRow() +
            '</td></tr></table>';
          const headBlock = (title, subLine, extraLine) =>
            '<div style="text-align:center;line-height:1.35;">' +
            `<p style="margin:2pt 0;font-size:13pt;font-weight:bold;">${esc(title)}</p>` +
            `<p style="margin:2pt 0;font-size:11pt;">${esc(subLine)}</p></div>` +
            nameSchoolRow() +
            p(extraLine);
          /* The DepEd letterhead block, straight from Settings — the same lines
             the main item-analysis export prints. It keeps its own font (Arial /
             Times); every other annex text renders in Bookman Old Style. */
          const headerHtml = '<div data-annex-header="1" style="text-align:center;line-height:1.3;margin-bottom:6pt;font-family:Arial,Helvetica,sans-serif;">' +
            iaHeaderLines().map(l => `<p style="margin:1pt 0;font-size:${l.size}pt;${l.bold ? 'font-weight:bold;' : ''}font-family:${l.serif ? "'Times New Roman',Georgia,serif" : 'Arial,Helvetica,sans-serif'};">${esc(l.text)}</p>`).join('') +
            '</div>';
          const logos = (si.schoolLogo1 || si.schoolLogo2)
            ? `<p style="text-align:center;margin:0 0 4pt;">${[si.schoolLogo1, si.schoolLogo2].filter(Boolean).map(src => `<img src="${src}" style="height:52px;" alt="" />`).join('&nbsp;&nbsp;&nbsp;')}</p>`
            : '';
          /* Annex 3 cause + intervention — computed from the same results the
             report shows, so the columns are never left blank. */
          const compDetail = (name) => {
            const items = results.filter(r => r.competency === name);
            const avg = items.length ? items.reduce((a, r) => a + (Number(r.percentage) || 0), 0) / items.length : 0;
            return { nums: items.map(r => r.itemNo).join(', '), avg, n: items.length };
          };
          /* Likely causes for the Reasons/s/Cause/s column — why learners got
             the items wrong, not just what they scored. Severe band (<40%) and
             moderate band (40–59%) pools; a stable hash of the row's own data
             picks one, so every row reads differently but never changes
             between renders. */
          const REASON_SEVERE = [
            'Learners may have lacked the foundational skill this competency builds on, so they could not even start the task',
            'Unfamiliar vocabulary in the items may have stopped learners from understanding what was being asked',
            'Learners may have confused this competency with a closely related one and applied the wrong procedure',
            'Close distractors may have led learners to guess instead of reasoning through each step',
            'Learners may have had too little practice with real-life examples, so they could not transfer the skill to new situations'
          ];
          const REASON_WEAK = [
            'Learners may have rushed and overlooked the key detail in the stem, picking the first plausible option',
            'Some learners may have understood the concept but misread what the item was asking for',
            'Learners may have succeeded on familiar examples but got stuck on unfamiliar ones',
            'The multi-step reasoning the items require may have caused learners to lose track halfway through the solution'
          ];
          /* Classroom-delivery causes — the exam is only half the story; the
             lesson itself may not have landed. Causes alternate: one row
             explains the exam scenario, the next the classroom delivery, so
             both perspectives always appear in the table. */
          const REASON_DELIVERY = [
            'The competency may not have been fully covered during classroom delivery, so learners met it for the first time in the test',
            'Classroom practice may have stayed at whole-class level, leaving slower learners without the guided practice they needed',
            'The lesson pace may have moved on before every learner could demonstrate the skill',
            'Real-life examples and visuals may not have been used enough during instruction for the concept to stick',
            'Quick checks during the lesson may not have surfaced these gaps before the exam'
          ];
          const reasonFor = (d, i) => {
            const where = d.n ? `${d.n > 1 ? 'items' : 'item'} ${d.nums}` : 'its items';
            const pool = i % 2 === 1
              ? REASON_DELIVERY
              : (d.avg < 40 ? REASON_SEVERE : REASON_WEAK);
            let h = 0;
            const key = `${d.nums}:${d.avg.toFixed(2)}`;
            for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
            return `${pool[h % pool.length]} (${where} \u2014 ${d.avg.toFixed(2)}% answered correctly)`;
          };
          const interventionFor = (d) => (d.avg < 40
            ? 'Reteach with concrete examples, guided practice and visual aids, then re-check with a short 3-item quiz.'
            : 'Give targeted reinforcement activities and small-group remediation; revisit common errors through class discussion.');
          let content;
          if (kind === 'annex1') {
            const w = [21, 20, 20, 17, 22];
            const mean = m.totalTakers > 0 ? m.totalRaw / m.totalTakers : 0;
            const mpsPct = m.items > 0 ? (mean / m.items) * 100 : 0;
            const gradeLine = /grade/i.test(meta.gradeLevel || '') ? meta.gradeLevel : `GRADE ${meta.gradeLevel || ''}`;
            const headRow = tr([
              [w[0], 'Subject', 'text-align:left;font-weight:bold;'],
              [w[1], 'No. of Items', 'font-weight:bold;'],
              [w[2], 'No. of Correct Responses', 'font-weight:bold;'],
              [w[3], 'Mean Score', 'font-weight:bold;'],
              [w[4], 'MPS', 'font-weight:bold;']
            ]);
            const dataRow = tr([
              [w[0], meta.subject, 'text-align:left;'],
              [w[1], String(m.items)],
              [w[2], String(m.totalRaw)],
              [w[3], mean.toFixed(2)],
              [w[4], mpsPct.toFixed(2)]
            ]);
            // the form prints eight rows — one filled, seven for handwritten use
            const blank = tr(w.map(x => [x, '', 'height:28pt;']));
            content = `${logos}${headerHtml}${headBlock(
              `Annex 1. MPS per Learning Area for the ${term} Term, SY: ${meta.schoolYear}`,
              `${term} Term Learning Area MPS (SY: ${meta.schoolYear})`,
              `Grade Level: ${gradeLine}`
            )}
<table style="width:100%;border-collapse:collapse;table-layout:fixed;">
${headRow}
${dataRow}
${blank.repeat(7)}
</table>
${signTable([
              { label: 'Prepared by', name: si.teacherName, title: si.teacherTitle },
              { label: 'Certified Correct', name: si.checkedBy || si.approvedBy, title: si.checkedByPosition || si.approvedByPosition }
            ])}`;
          } else {
            const w = [23, 24, 29, 24];
            const headRow = tr([
              [w[0], 'Learning Area', 'text-align:left;font-weight:bold;'],
              [w[1], 'Least Mastered Competencies', 'text-align:left;font-weight:bold;'],
              [w[2], 'Reasons/s/Cause/s', 'text-align:left;font-weight:bold;'],
              [w[3], 'Proposed Intervention Activity', 'text-align:left;font-weight:bold;']
            ]);
            /* Only competencies that are genuinely LOW by score belong here —

                [w[1], c.competency, 'text-align:left;vertical-align:top;'],
                [w[2], reasonFor(d, i), 'text-align:left;vertical-align:top;'],
                [w[3], interventionFor(d), 'text-align:left;vertical-align:top;']
              ]);

                [w[1], `None — every competency scored ${LOW_MPS}% or above.`, 'text-align:left;vertical-align:top;'],
                [w[2], '', 'vertical-align:top;'],
                [w[3], '', 'vertical-align:top;']

${headRow}
${dataRows}
${pad ? blank.repeat(pad) : ''}
</table>

              { label: 'Reviewed by', name: si.checkedBy, title: si.checkedByPosition },
              { label: 'Approved', name: si.approvedBy, title: si.approvedByPosition }
            ])}`;
          }

          // renders in Bookman Old Style; only headerHtml overrides it.
          return `<div style="font-family:'Bookman Old Style',Arial,sans-serif;">${content}</div>`;
        };

        const buildAnnexHtml = (kind, opts) => {
          const forDoc = !!(opts && opts.forDoc);
          const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

          const pageCss = forDoc
            ? '<style>@page WordSection1 {size:8.5in 11in; margin:0.6in;} div.WordSection1 {page:WordSection1;}</style>'
            : '';
