                </button>
                <button
                  onClick={finishAnalysis}
                  className="flex items-center justify-center gap-2 px-8 py-3 rounded-xl bg-iris-600 text-white hover:bg-iris-700 font-semibold shadow-md transition-all"
                >
                  <LucideIcon name="Table" className="w-5 h-5" /> Generate Report
                </button>
              </div>
            </div>
          );
        };

        const renderResults = () => {
          const compPerf = Object.values(results.reduce((acc, r) => {
            const k = r.competency;
            if (!acc[k]) acc[k] = { competency: k, total: 0, n: 0 };
            acc[k].total += parseFloat(r.percentage);
            acc[k].n += 1;
            return acc;
          }, {})).map(c => ({ ...c, average: (c.total / c.n).toFixed(2) })).sort((a, b) => parseFloat(b.average) - parseFloat(a.average));

          // Data + column maths for the Excel-style preview.
          const xl = iaBuildModel(meta, sections, itemCount);
          // Uniform columns, mirroring the Word export fix: a fixed layout with
          // explicit widths stops one item column (item 8) outgrowing the rest.
          const xItemW = 34;
          const xFixedW = [150, 90, 100, 130, 120];
          const xRightW = [110, 60, 100];
          // Bands mirror the export: AT MOST TWO. Band 1 holds the first 30
          // items at full width; everything else lands in one second band
          // alongside the summary columns.
          const xBandOne = 30;
          const xBands = [];
          if (xl.items > 0) {
            xBands.push([0, Math.min(xl.items, xBandOne)]);
            if (xl.items > xBandOne) xBands.push([xBandOne, xl.items]);
          }
          // One shared item-column width for BOTH bands (mirrors the export):
          // band 1 sets the sheet width, and a wide band 2 — it carries the
          // summary block — pulls both bands down to the same narrower column
          // so the grids line up exactly.
          const xFixedSum = xFixedW.reduce((a, b) => a + b, 0);
          const xRightSum = xRightW.reduce((a, b) => a + b, 0);
          const xSheetW = xFixedSum + Math.min(xl.items, xBandOne) * xItemW;
          const xSharedItemW = xBands.length > 1
            ? Math.max(2, Math.floor(Math.min(xItemW,
              (xSheetW - xFixedSum - xRightSum) / Math.max(1, xl.items - xBandOne))))
            : xItemW;
          const xBandCols = (bi, start, end) => {
            const n = end - start;
            // The summary columns (Total Raw Score · MPS · Mastery Level) are
            // whole-test values — they sit on the LAST band only, so no one
            // mistakes them for a total of that band's items alone.
            const isLast = bi === xBands.length - 1;
            return [...xFixedW,
              ...Array.from({ length: n }, () => xSharedItemW),
              ...(isLast ? xRightW : [])];
          };
          const xBandW = (bi, start, end) => xBandCols(bi, start, end).reduce((a, b) => a + b, 0);
          // The School/Subject/School Year/Grading Period block gets its own
          // table and its own column grid, exactly like the export: resizing a
          // cell there can never shift the score grid underneath it. It is as
          // wide as the first band so everything still lines up.
          const xInfoW = xBandW(0, xBands[0] ? xBands[0][0] : 0, xBands[0] ? xBands[0][1] : 0);
          const xInfoLabelW = 120;
          const xInfoValueW = Math.round((xInfoW - 2 * xInfoLabelW) / 2);
          const xHead = 'border border-ink/30 px-1.5 py-1 text-[10px] font-semibold text-center bg-ink/10 whitespace-nowrap';
          const xCell = 'border border-ink/30 px-1.5 py-1 text-[10px] text-center whitespace-nowrap';
          const xlHeaders = (start, end, withTotals) => [
            'Subject', 'Grade Level', 'Section', 'Total No. of Takers', 'Total No. of Items',
            ...Array.from({ length: end - start }, (_, i) => start + i + 1),
            ...(withTotals ? ['Total Raw Score', 'MPS', 'Mastery Level'] : [])
          ];

          return (
          <div className="max-w-5xl mx-auto space-y-6">
            <div className="bg-white rounded-2xl ring-1 ring-ink/10 p-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div>
                <h2 className="font-display text-2xl font-light tracking-tight text-ink">Analysis Report</h2>
                <p className="text-sm text-ink/50 mt-1">{sections.length} section{sections.length === 1 ? '' : 's'} · {totalLearners} learners evaluated across {itemCount} items</p>
              </div>
              <div className="flex flex-wrap justify-end gap-2 w-full sm:w-auto">
                <button
                  onClick={resetAnalyzer}
                  className="flex items-center gap-2 px-4 py-2 rounded-lg bg-ink/5 text-ink/60 hover:bg-ink/10 border border-ink/10 font-medium text-sm transition-colors"
                >
                  <LucideIcon name="RotateCcw" className="w-5 h-5" /> New Analysis
                </button>
                <button onClick={downloadCSV} className="flex items-center gap-2 px-4 py-2 rounded-lg bg-ink/5 text-ink/60 hover:bg-ink/10 border border-ink/10 font-medium text-sm transition-colors">
                  <LucideIcon name="Download" className="w-5 h-5" /> Export CSV
                </button>
                <button onClick={downloadDocx} className="flex items-center gap-2 px-4 py-2 rounded-lg bg-iris-600 text-white hover:bg-iris-700 border border-iris-600 font-medium text-sm transition-colors">
                  <LucideIcon name="FileText" className="w-5 h-5" /> Export DOCX
                </button>
                <button onClick={downloadDoc} className="flex items-center gap-2 px-4 py-2 rounded-lg bg-ink/5 text-ink/60 hover:bg-ink/10 border border-ink/10 font-medium text-sm transition-colors">
                  <LucideIcon name="FileText" className="w-5 h-5" /> Export DOC
                </button>
                <span className="hidden sm:block w-px self-stretch bg-ink/10" aria-hidden="true" />
                <button onClick={() => downloadAnnex('annex1')} title="MPS per Learning Area (DepEd Annex 1 / ST-2)"
                  className="flex items-center gap-2 px-4 py-2 rounded-lg bg-iris-50 text-iris-700 hover:bg-iris-100 border border-iris-200 font-medium text-sm transition-colors">
                  <LucideIcon name="Table" className="w-5 h-5" /> Annex 1 · MPS
                </button>
                <button onClick={() => downloadAnnex('annex3')} title="Least Mastered Competencies (DepEd Annex 3 / SS-10)"
                  className="flex items-center gap-2 px-4 py-2 rounded-lg bg-iris-50 text-iris-700 hover:bg-iris-100 border border-iris-200 font-medium text-sm transition-colors">
                  <LucideIcon name="ClipboardList" className="w-5 h-5" /> Annex 3 · LMC
                </button>
              </div>
            </div>

            {/* Excel-style preview — replicates Item-Analysis-*.xlsx */}
            <div className="bg-white rounded-2xl ring-1 ring-ink/10 overflow-hidden shadow-sm">
              <div className="px-6 py-4 border-b border-ink/10 flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-2">
                  <LucideIcon name="Table" className="w-5 h-5 text-iris-600" />
                  <h3 className="font-semibold text-lg text-ink">Excel Preview — {IA_TITLE}</h3>
                </div>
                <div className="flex items-center gap-2 text-[10px] uppercase tracking-wider text-ink/40">
                  <span>{xl.rows.length} section{xl.rows.length === 1 ? '' : 's'}</span>
                  <span>·</span>
                  <span>{xl.items} items</span>
                </div>
              </div>
              <div className="p-4 overflow-x-auto">
                <div className="w-max">
                  {iaHeaderJsx()}
                  <table className="border-collapse table-fixed text-[10px] text-ink" style={{ width: xInfoW }}>
                    <colgroup>
                      <col style={{ width: xInfoLabelW }} />
                      <col style={{ width: xInfoValueW }} />
                      <col style={{ width: xInfoLabelW }} />
                      <col style={{ width: xInfoW - 2 * xInfoLabelW - xInfoValueW }} />
                    </colgroup>
                    <tbody>
                      <tr>
                        <td className={`${xCell} font-semibold bg-ink/5 text-left`}>School:</td>
                        <td className={`${xCell} text-left`}>{schoolInfo.schoolName}</td>
                        <td className={`${xCell} font-semibold bg-ink/5`}>School Year:</td>
                        <td className={xCell}>{meta.schoolYear}</td>
                      </tr>
                      <tr>
                        <td className={`${xCell} font-semibold bg-ink/5 text-left`}>Subject</td>
                        <td className={`${xCell} text-left`}>{meta.subject}</td>
                        <td className={`${xCell} font-semibold bg-ink/5`}>Term / Grading Period</td>
                        <td className={xCell}>{meta.gradingPeriod}</td>
                      </tr>
                    </tbody>
                  </table>
                  {xBands.map(([start, end], bi) => {
                    const isLast = bi === xBands.length - 1;
                    const cols = xBandCols(bi, start, end);
                    const tableW = xBandW(bi, start, end);
                    const title = bi === 0 ? IA_TITLE : `${IA_TITLE} \u2014 Items ${start + 1}\u2013${end}`;
                    return (
                      <table key={bi} data-ia-grid className="border-collapse table-fixed text-[10px] text-ink" style={{ width: tableW }}>
                        <colgroup>
                          {cols.map((w, i) => <col key={i} style={{ width: w }} />)}
                        </colgroup>
                        <tbody>
                          <tr>
                            <td colSpan={cols.length} className={`${xCell} py-2 text-xs font-bold`}>{title}</td>
                          </tr>
                          <tr>
                            {xlHeaders(start, end, isLast).map((h, i) => (
                              <th key={i} className={xHead}>{h}</th>
                            ))}
                          </tr>
                          {xl.rows.map((r, i) => (
                            <tr key={i} className="hover:bg-iris-50/60">
                              <td className={xCell}>{meta.subjectCode || meta.subject}</td>
                              <td className={xCell}>{meta.gradeLevel}</td>
                              <td className={xCell}>{r.name || `Section ${i + 1}`}</td>
                              <td className={xCell}>{r.takers}</td>
                              <td className={xCell}>{xl.items}</td>
                              {r.scores.slice(start, end).map((v, j) => <td key={j} className={xCell}>{v}</td>)}
                              {isLast && <td className={`${xCell} font-semibold`}>{r.raw}</td>}
                              {isLast && <td className={xCell}>{Math.round(r.mps)}</td>}
                              {isLast && <td className={xCell}>{iaFixed(r.mastery, 2)}</td>}
                            </tr>
                          ))}
                          <tr className="bg-ink/5 font-semibold">
                            <td className={xCell}></td>
                            <td colSpan={2} className={`${xCell} text-left`}>Total</td>
                            <td className={xCell}>{xl.totalTakers}</td>
                            <td className={xCell}>{xl.items}</td>
                            {xl.perItem.slice(start, end).map((v, j) => <td key={j} className={xCell}>{v}</td>)}
                            {isLast && <td className={xCell}>{xl.totalRaw}</td>}
                            {isLast && <td className={xCell}>{Math.round(xl.mps)}</td>}
                            {isLast && <td className={xCell}>{iaFixed(xl.mastery, 2)}</td>}
                          </tr>
                          <tr className="bg-ink/5 font-semibold">
                            <td className={xCell}></td>
                            <td colSpan={3} className={`${xCell} text-left`}>MPS per Item</td>
                            <td className={xCell}></td>
                            {xl.mpsPerItem.slice(start, end).map((v, j) => <td key={j} className={xCell}>{iaTrim(v)}</td>)}
                            {isLast && <td className={xCell}></td>}
                            {isLast && <td className={xCell}></td>}
                            {isLast && <td className={xCell}></td>}
                          </tr>
                        </tbody>
                      </table>
                    );
                  })}
                  <div className="flex flex-wrap gap-x-16 gap-y-6 mt-8 px-4 text-[11px]">
                    {iaSignatories().map((b, i) => (
                      <div key={i} className="min-w-40">
                        <p className="text-ink/50">{b.label}:</p>
                        <p className="h-8" />
                        <p className="font-semibold text-ink">{b.name}</p>
                        <p className="text-ink/50">{b.title}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* DepEd annex previews — the exact HTML the Word exports carry */}
            <div className="bg-white rounded-2xl ring-1 ring-ink/10 overflow-hidden shadow-sm">
              <div className="px-6 py-4 border-b border-ink/10 flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-2">
                  <LucideIcon name="FileText" className="w-5 h-5 text-iris-600" />
                  <h3 className="font-semibold text-lg text-ink">DepEd Annexes</h3>
                </div>
                <p className="text-[10px] uppercase tracking-wider text-ink/40">Preview — downloads match exactly</p>
              </div>
              <div className="p-4 grid gap-6 items-start">
                {[['annex1', 'Annex 1 · MPS per Learning Area'], ['annex3', 'Annex 3 · Least Mastered Competencies']].map(([kind, label]) => (
                  <div key={kind} className="border border-ink/10 rounded-xl overflow-hidden">
                    <div className="px-4 py-2.5 bg-ink/5 border-b border-ink/10 flex items-center justify-between gap-2">
                      <span className="text-xs font-semibold text-ink">{label}</span>
                      <button
                        onClick={() => downloadAnnex(kind)}
                        className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-iris-600 text-white hover:bg-iris-700 font-medium text-xs transition-colors"
                      >
                        <LucideIcon name="Download" className="w-3.5 h-3.5" /> Download
                      </button>
                    </div>
                    <div className="p-3 bg-ink/5">
                      <div
                        data-annex-preview={kind}
                        className="bg-white border border-ink/10 shadow-sm p-6 overflow-x-auto text-[#111]"
                        style={{ fontFamily: "'Bookman Old Style', Arial, sans-serif", fontSize: '11pt' }}
                        dangerouslySetInnerHTML={{ __html: buildAnnexContent(kind) }}
                      />
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Metrics */}
            <div className="grid md:grid-cols-2 gap-4">
              <div className="bg-iris-50 border border-iris-100 p-6 rounded-2xl flex flex-col items-center text-center">
                <span className="text-ink/40 text-xs font-semibold uppercase tracking-wider mb-1">Mean Score</span>
                <span className="text-4xl font-bold text-iris-600">{overallScores.mean}</span>
              </div>
              <div className="bg-iris-50 border border-iris-100 p-6 rounded-2xl flex flex-col items-center text-center">
                <span className="text-ink/40 text-xs font-semibold uppercase tracking-wider mb-1">Mean Percentage Score (MPS)</span>
                <div className="flex items-baseline gap-1">
                  <span className="text-4xl font-bold text-iris-600">{overallScores.mps}</span>
                  <span className="text-xl font-bold text-iris-600">%</span>
                </div>
              </div>
            </div>

            {/* Insight */}
            <div className="bg-gradient-to-br from-iris-500/10 to-blue-500/10 border border-iris-200 p-6 rounded-2xl">
              <div className="flex items-start gap-3">
                <div className="p-2.5 bg-iris-500 text-white rounded-lg"><LucideIcon name="BrainCircuit" className="w-5 h-5" /></div>
                <div>
                  <h3 className="font-semibold text-lg text-ink mb-1">AI Interpretation</h3>
                  <p className="text-ink/60 text-sm leading-relaxed">{aiInsight}</p>
                </div>
              </div>
            </div>

            {/* Performance by Competency */}
            <div className="bg-white rounded-2xl ring-1 ring-ink/10 overflow-hidden shadow-sm">
              <div className="px-6 py-4 border-b border-ink/10 flex items-center gap-2">
                <LucideIcon name="ClipboardList" className="w-5 h-5 text-iris-600" />
                <h3 className="font-semibold text-lg text-ink">Performance by Competency</h3>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-ink/5 border-b border-ink/10">
                      <th className="py-3 px-6 text-[10px] font-semibold text-ink/40 uppercase tracking-wider">Competency</th>
                      <th className="py-3 px-6 text-[10px] font-semibold text-ink/40 uppercase tracking-wider text-center">Items</th>
                      <th className="py-3 px-6 text-[10px] font-semibold text-ink/40 uppercase tracking-wider text-center">Avg %</th>
                      <th className="py-3 px-6 text-[10px] font-semibold text-ink/40 uppercase tracking-wider">Mastery</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-ink/10">
                    {compPerf.map((c, i) => (
                      <tr key={i} className="hover:bg-ink/5 transition-colors">
                        <td className="py-3 px-6 text-sm text-ink/70 max-w-sm">{c.competency}</td>
                        <td className="py-3 px-6 text-sm text-center text-ink">{c.n}</td>
                        <td className="py-3 px-6 text-sm font-bold text-center text-ink">{c.average}%</td>
                        <td className="py-3 px-6 text-sm">
                          <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold border ${getMasteryBadge(getMasteryLevel(parseFloat(c.average)))}`}>
                            {getMasteryLevel(parseFloat(c.average))}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Mastery summary */}
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
              {[
                { label: 'High', key: 'High Mastery', color: 'bg-emerald-500/10 text-emerald-600 border-emerald-200' },
                { label: 'Mod. Avg', key: 'Moderately Average Mastery', color: 'bg-blue-500/10 text-blue-600 border-blue-200' },
                { label: 'Average', key: 'Average Mastery', color: 'bg-yellow-500/10 text-yellow-600 border-yellow-200' },
                { label: 'Low', key: 'Low Mastery', color: 'bg-orange-500/10 text-orange-600 border-orange-200' },
                { label: 'None', key: 'No Mastery', color: 'bg-rose-500/10 text-rose-600 border-rose-200' },
              ].map((s, i) => (
                <div key={i} className={`p-4 rounded-xl border flex flex-col items-center text-center ${s.color}`}>
                  <span className="text-3xl font-bold text-ink">{summaryStats[s.key] || 0}</span>
                  <span className="text-[10px] uppercase tracking-wider font-medium text-ink/50 mt-1">{s.label}</span>
                </div>
              ))}
            </div>

            {/* Bar chart */}
            <div className="bg-white rounded-2xl ring-1 ring-ink/10 p-6 shadow-sm">
              <h3 className="text-lg font-semibold text-ink mb-6 flex items-center gap-2">
                <LucideIcon name="BarChart3" className="w-5 h-5 text-iris-500" />
                Item Performance Chart
              </h3>
              <div className="h-64 w-full flex items-end gap-1.5 md:gap-2 overflow-x-auto pb-4 px-2">
                {results.map(row => (
                  <div key={row.itemNo} className="relative group flex-1 flex flex-col justify-end min-w-[20px] md:min-w-[30px] cursor-pointer">
                    <div className="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 hidden group-hover:flex flex-col items-center z-20 w-48 pointer-events-none">
                      <div className="bg-ink text-white text-[10px] rounded-lg py-2 px-3 shadow-xl border border-ink/20 text-center whitespace-normal">
                        <p className="font-bold text-sm">Item {row.itemNo}</p>
                        <p className="text-[10px] text-ink/40 mt-1 line-clamp-2">{row.competency}</p>
                        <p className="font-black text-lg mt-1">{row.percentage}%</p>
                        <p className="text-[10px] uppercase tracking-wider mt-1 text-ink/40">{row.masteryLevel}</p>
                      </div>
                      <div className="w-3 h-3 bg-ink border-b border-r transform rotate-45 translate-y-[-50%]"></div>
                    </div>
                    <div className={`w-full rounded-t-sm transition-all ${getBarColor(parseFloat(row.percentage))}`} style={{ height: `${Math.max(parseFloat(row.percentage), 5)}%` }}></div>
                    <span className="text-[10px] md:text-xs text-ink/40 text-center mt-2 w-full truncate">{row.itemNo}</span>

                  ['bg-emerald-500', 'High'],

              <div className="bg-rose-50 border border-rose-100 p-6 rounded-2xl">

                <div className="grid md:grid-cols-3 gap-3">

              </div>

            <div className="bg-white rounded-2xl ring-1 ring-ink/10 overflow-hidden shadow-sm">
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-ink/5 border-b border-ink/10">

                      <th className="py-4 px-6 text-[10px] font-semibold text-ink/40 uppercase tracking-wider">Competency</th>

                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          );
        };

        return (
          <div className="min-h-screen bg-ink/5 font-sans text-ink pb-12">

            {step === 2 && renderAnalyzing()}

      /* ============================================================
         RENDER
         ============================================================ */

                        <>
                        {validationWarnings.length>0&&(
                          <div data-testid="validation-warnings" className="bg-amber-50 ring-1 ring-amber-200 rounded-xl px-4 py-3 text-sm text-amber-800 mb-4 space-y-0.5">
                            {validationWarnings.map((w,i)=><p key={i} className="flex items-start gap-2"><LucideIcon name="AlertTriangle" className="w-4 h-4 text-amber-500 mt-0.5 flex-shrink-0"/> {w}</p>)}
                          </div>
                        )}
                        <div ref={previewRef} className={'prose prose-slate max-w-none break-words' + (k3Mode ? ' k3-mode' : '')} dangerouslySetInnerHTML={{__html: buildPreviewHtml()}}/>
                        </>
                      ):(
                        <div className="flex flex-col items-center justify-center h-full text-center text-ink/40">
                          <LucideIcon name="File" className="w-11 h-11 mb-4"/>
                          <p className="font-medium text-ink/55">Your generated test appears here</p>
                          <p className="text-sm mt-1">Configure the left panel, then generate.</p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
